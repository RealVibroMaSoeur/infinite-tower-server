services:
  - type: web
    name: infinite-tower-server
    env: node
    plan: free
    region: frankfurt
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_VERSION
        value: 20.18.1
      - key: PORT
        value: 8080
      - key: DATA_DIR
        value: ./data
      - key: RECONNECT_GRACE_MS
        value: 45000
      - key: FIREBASE_PROJECT_ID
        value: infinite-tower-d456f
